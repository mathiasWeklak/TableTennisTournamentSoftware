# Builds installable packages (with bundled Java runtime) for Windows, Linux and macOS.
#
# - Push a tag like "v1.0.0": packages are built and attached to a GitHub release.
# - "Run workflow" in the Actions tab: packages are built and available as workflow artifacts.
#
# jpackage can only build packages for the system it runs on, so every system has its own job.
# The packages are not code-signed: Windows (SmartScreen) and macOS (Gatekeeper) show a warning
# on the first start.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Package (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            label: windows
          - os: ubuntu-24.04
            label: linux
          - os: macos-latest
            label: macos-arm64
          - os: macos-15-intel
            label: macos-x64
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle   # keeps the downloaded dependencies between runs

      # The Gradle wrapper does not retry a failed download (timeouts, HTTP 504 from the mirror).
      # Gradle (same version as the wrapper) is therefore downloaded with curl, which retries with
      # growing pauses, and put on the PATH; the steps below call "gradle".
      - name: Install Gradle
        shell: bash
        run: |
          url=$(grep '^distributionUrl=' gradle/wrapper/gradle-wrapper.properties | cut -d= -f2- | sed 's/\\:/:/g')
          echo "Gradle: $url"
          tmp="$RUNNER_TEMP"
          if command -v cygpath >/dev/null; then tmp=$(cygpath -u "$RUNNER_TEMP"); fi   # Windows (Git Bash)
          # without --retry-delay curl waits longer after every failed attempt (1 s, 2 s, 4 s, ...)
          curl -fsSL --retry 8 --retry-all-errors --connect-timeout 30 -o "$tmp/gradle.zip" "$url"
          mkdir -p "$tmp/gradle"
          if command -v unzip >/dev/null; then
            unzip -q "$tmp/gradle.zip" -d "$tmp/gradle"
          else
            7z x -y -o"$tmp/gradle" "$tmp/gradle.zip" > /dev/null
          fi
          home=$(ls -d "$tmp"/gradle/gradle-*)
          chmod +x "$home/bin/gradle"
          if command -v cygpath >/dev/null; then cygpath -w "$home/bin" >> "$GITHUB_PATH"; else echo "$home/bin" >> "$GITHUB_PATH"; fi
          "$home/bin/gradle" --version --no-daemon

      - name: Run tests
        if: matrix.label == 'linux'
        run: gradle test --no-daemon

      - name: Read version
        id: version
        shell: bash
        run: echo "version=$(grep -m1 '^version' build.gradle.kts | sed 's/[^0-9.]//g')" >> "$GITHUB_OUTPUT"

      # ---------------- Windows: portable ZIP + MSI installer ----------------
      - name: Windows portable ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true   # stop if gradle fails
          $ErrorActionPreference = 'Stop'
          gradle jpackage --no-daemon
          New-Item -ItemType Directory -Force out | Out-Null
          Compress-Archive -Path build/dist/TT-Turniersoftware -DestinationPath "out/TT-Turniersoftware-${{ steps.version.outputs.version }}-windows-portable.zip"

      - name: Windows MSI installer
        if: runner.os == 'Windows'
        continue-on-error: true   # needs the WiX Toolset of the runner image; the ZIP above works without
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $ErrorActionPreference = 'Stop'
          gradle jpackage -PinstallerType=msi --no-daemon
          Copy-Item build/dist/*.msi "out/TT-Turniersoftware-${{ steps.version.outputs.version }}-windows.msi"

      # ---------------- Linux: tar.gz + deb + rpm ----------------
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y rpm fakeroot
          mkdir -p out
          gradle jpackage --no-daemon
          tar -C build/dist -czf "out/TT-Turniersoftware-${{ steps.version.outputs.version }}-linux-x64.tar.gz" TT-Turniersoftware
          gradle jpackage -PinstallerType=deb --no-daemon
          cp build/dist/*.deb out/
          gradle jpackage -PinstallerType=rpm --no-daemon
          cp build/dist/*.rpm out/

      # ---------------- macOS: dmg ----------------
      - name: macOS disk image
        if: runner.os == 'macOS'
        run: |
          mkdir -p out
          gradle jpackage -PinstallerType=dmg --no-daemon
          cp build/dist/*.dmg "out/TT-Turniersoftware-${{ steps.version.outputs.version }}-${{ matrix.label }}.dmg"

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: packages-${{ matrix.label }}
          path: out/*
          if-no-files-found: error

  release:
    name: GitHub release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v') && !cancelled()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          path: packages
          merge-multiple: true

      - uses: softprops/action-gh-release@v3.0.3
        with:
          name: TT-Turniersoftware ${{ github.ref_name }}
          files: packages/*
          body: |
            Installierbare Pakete mit eingebauter Java-Laufzeit, kein Java nötig.

            | System | Datei |
            |---|---|
            | Windows | `…-windows.msi` (Installer) oder `…-windows-portable.zip` (entpacken, `TT-Turniersoftware.exe` starten) |
            | macOS (Apple Silicon / Intel) | `…-macos-arm64.dmg` / `…-macos-x64.dmg` |
            | Linux | `.deb` (Debian, Ubuntu), `.rpm` (Fedora, openSUSE) oder `…-linux-x64.tar.gz` |

            Die Pakete sind nicht signiert:
            - **Windows:** bei der Warnung „Der Computer wurde durch Windows geschützt“ auf „Weitere Informationen“ → „Trotzdem ausführen“ klicken.
            - **macOS:** beim ersten Start die App mit Rechtsklick → „Öffnen“ starten und bestätigen.
